# --- scope-aware table resolution -------------------------------------------------------
- {id: cte_name_scoped_to_subquery, sql: "SELECT (WITH duckdb_settings AS (SELECT 1 AS a) SELECT a FROM duckdb_settings) AS x, count(*) FROM duckdb_settings", expected: block, layer: 3, check: table_allowlist, why: "bypass found (code review): CTE names were global, so a CTE defined inside a subquery allowed the same name in the outer FROM, where DuckDB reads its system view"}
- {id: derived_alias_shadows_table, sql: "SELECT count(*) FROM (SELECT 1 AS a) AS duckdb_settings JOIN duckdb_settings AS z ON z.name = duckdb_settings.a", expected: block, layer: 3, check: table_allowlist, why: a derived-table alias is not a CTE and cannot make a sibling table reference legal}

# --- complexity limits -----------------------------------------------------------------
- {id: comma_join, sql: "SELECT count(*) FROM olist_orders_dataset, olist_order_items_dataset", expected: block, layer: 3, check: complexity, why: implicit cartesian join}
- {id: cross_join, sql: "SELECT count(*) FROM olist_orders_dataset CROSS JOIN olist_order_items_dataset", expected: block, layer: 3, check: complexity, why: explicit cartesian join}
- {id: join_on_true, sql: "SELECT count(*) FROM olist_orders_dataset o JOIN olist_order_items_dataset i ON TRUE", expected: block, layer: 3, check: complexity, why: cartesian join disguised with ON TRUE}
- {id: join_on_one_equals_one, sql: "SELECT count(*) FROM olist_orders_dataset o JOIN olist_order_items_dataset i ON 1 = 1", expected: block, layer: 3, check: complexity, why: cartesian join disguised with ON 1 = 1}
- {id: join_on_one_side, sql: "SELECT count(*) FROM olist_orders_dataset o JOIN olist_order_items_dataset i ON o.order_status = 'delivered'", expected: block, layer: 3, check: complexity, why: ON condition that only filters one side}
- {id: join_on_self_equalities, sql: "SELECT count(*) FROM olist_orders_dataset o JOIN olist_order_items_dataset i ON o.order_id = o.order_id AND i.order_id = i.order_id", expected: block, layer: 3, check: complexity, why: "bypass found (code review): the ON mentions both tables but never relates them, so it is a cartesian product"}
- {id: join_on_or_true, sql: "SELECT count(*) FROM olist_orders_dataset o JOIN olist_order_items_dataset i ON o.order_id = i.order_id OR TRUE", expected: block, layer: 3, check: complexity, why: an equality inside an OR does not constrain the join}
- {id: join_on_range_only, sql: "SELECT count(*) FROM olist_orders_dataset o JOIN olist_order_items_dataset i ON o.order_id < i.order_id", expected: block, layer: 3, check: complexity, why: a range-only join is close to a cartesian product}
- {id: natural_join,sql: "SELECT count(*) FROM olist_orders_dataset NATURAL JOIN olist_order_items_dataset", expected: block, layer: 3, check: complexity, why: "bypass found (first draft accepted it): qualify() rewrites NATURAL JOIN into an explicit ON, so a join check on the qualified tree passed it"}
- {id: positional_join, sql: "SELECT count(*) FROM olist_orders_dataset POSITIONAL JOIN olist_order_items_dataset", expected: block, layer: 3, check: complexity, why: DuckDB positional join}
- {id: too_many_joins, sql: "SELECT count(*) FROM olist_orders_dataset o JOIN olist_order_items_dataset i ON o.order_id = i.order_id JOIN olist_order_payments_dataset p ON o.order_id = p.order_id JOIN olist_order_reviews_dataset r ON o.order_id = r.order_id JOIN olist_customers_dataset c ON o.customer_id = c.customer_id JOIN olist_sellers_dataset s ON i.seller_id = s.seller_id", expected: block, layer: 3, check: complexity, why: 5 joins (max 4)}
- {id: too_deep, sql: "SELECT a FROM (SELECT a FROM (SELECT a FROM (SELECT a FROM (SELECT 1 AS a) AS t1) AS t2) AS t3) AS t4", expected: block, layer: 3, check: complexity, why: subquery depth 4 (max 3)}
- {id: recursive_cte, sql: "WITH RECURSIVE r AS (SELECT 1 AS n UNION ALL SELECT n + 1 FROM r) SELECT n FROM r", expected: block, layer: 3, check: complexity, why: "unbounded recursion: the outer LIMIT does not stop it"}

