# Red-team corpus for layer 3 (validator). tests/test_validator.py runs every entry.
#
#   id:        unique test id
#   sql:       the SQL as an attacker (or a confused model) would submit it
#   expected:  allow | block
#   layer:     the layer expected to decide (3 = validator)
#   check:     (block only, optional) the validator check expected to fail first
#   why:       what the entry tests
#
# Entries marked "bypass found" were accepted by an earlier draft of the validator.
# They stay here as regression tests.

