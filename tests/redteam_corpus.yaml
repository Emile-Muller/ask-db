- {id: ok_cte_in_subquery, sql: "SELECT (WITH c AS (SELECT count(*) AS n FROM olist_sellers_dataset) SELECT n FROM c) AS sellers", expected: allow, layer: 3, why: a CTE used inside the subquery that defines it}
- {id: ok_left_join,sql: "SELECT o.order_status, count(r.review_id) AS reviews FROM olist_orders_dataset o LEFT JOIN olist_order_reviews_dataset r ON o.order_id = r.order_id GROUP BY o.order_status", expected: allow, layer: 3, why: LEFT JOIN}
- {id: ok_four_joins, sql: "SELECT count(*) FROM olist_orders_dataset o JOIN olist_order_items_dataset i ON o.order_id = i.order_id JOIN olist_order_payments_dataset p ON o.order_id = p.order_id JOIN olist_customers_dataset c ON o.customer_id = c.customer_id JOIN olist_sellers_dataset s ON i.seller_id = s.seller_id", expected: allow, layer: 3, why: exactly the 4-join maximum}
- {id: ok_depth_three, sql: "SELECT a FROM (SELECT a FROM (SELECT a FROM (SELECT 1 AS a) AS t1) AS t2) AS t3", expected: allow, layer: 3, why: exactly the depth-3 maximum}
- {id: ok_exists_correlated, sql: "SELECT count(*) FROM olist_orders_dataset o WHERE EXISTS (SELECT 1 FROM olist_order_reviews_dataset r WHERE r.order_id = o.order_id AND r.review_score = 5)", expected: allow, layer: 3, why: correlated EXISTS}
- {id: ok_parenthesized, sql: "(SELECT count(*) FROM olist_sellers_dataset)", expected: allow, layer: 3, why: parenthesized root query}
- {id: ok_extract_date_part, sql: "SELECT extract(year FROM order_purchase_timestamp) AS y, date_part('month', order_purchase_timestamp) AS m, count(*) AS n FROM olist_orders_dataset GROUP BY y, m ORDER BY y, m", expected: allow, layer: 3, why: extract and date_part}
