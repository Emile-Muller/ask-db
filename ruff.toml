target-version = "py311"
line-length = 100
extend-exclude = ["data"]

[lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "SIM", # flake8-simplify
]

[lint.per-file-ignores]
"tests/**" = ["S101"]  # assert is fine in tests
# Table names come from local CSV filenames at build time, not user/LLM input.
"agentic_query/build_db.py" = ["S608"]
