[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "text2sql"
dynamic = ["version"]
description = "Safe text-to-SQL pipeline: the LLM proposes, deterministic code decides."
requires-python = ">=3.11"
dependencies = ["duckdb>=2.0", "sqlglot>=30.0", "pyyaml>=6.0"]

[tool.setuptools.dynamic]
version = { file = "VERSION" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["text2sql", "olist_db"]
branch = true

[tool.coverage.report]
show_missing = true
skip_empty = true
